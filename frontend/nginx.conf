server {
    listen 8080;
    server_name _;

    absolute_redirect off;
    port_in_redirect off;
    server_name_in_redirect off;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/mime.types;

    location = /login {
        try_files /index.html =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
