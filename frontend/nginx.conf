server {
  listen 8080;

  # Never include :8080 or http:// in any Nginx redirect
  absolute_redirect off;
  port_in_redirect off;

  root   /usr/share/nginx/html;
  index  index.html index.htm;
  include /etc/nginx/mime.types;

  location / {
      # Serves static files, prerendered route/index.html, or SPA fallback without a 301 directory redirect
      try_files $uri $uri/index.html /index.html;
  }
}
