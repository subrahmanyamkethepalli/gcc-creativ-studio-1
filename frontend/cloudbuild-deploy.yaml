steps:

  # ==========================================================
  # Step 1: Build frontend Docker image
  # ==========================================================

  - name: "gcr.io/cloud-builders/docker"
    id: "Build Frontend Container"

    args:
      - "build"
      - "-t"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/cs-be-development-repo/${_FE_SERVICE_NAME}:${SHORT_SHA}"
      - "."

    dir: "frontend"


  # ==========================================================
  # Step 2: Push frontend image to Artifact Registry
  # ==========================================================

  - name: "gcr.io/cloud-builders/docker"
    id: "Push Frontend Container"

    args:
      - "push"
      - "${_REGION}-docker.pkg.dev/${PROJECT_ID}/cs-be-development-repo/${_FE_SERVICE_NAME}:${SHORT_SHA}"

    waitFor:
      - "Build Frontend Container"


  # ==========================================================
  # Step 3: Deploy frontend to private Cloud Run
  # ==========================================================

  - name: "gcr.io/cloud-builders/gcloud"
    id: "Deploy Frontend to Cloud Run"

    entrypoint: "gcloud"

    args:
      - "run"
      - "deploy"
      - "${_FE_SERVICE_NAME}"

      - "--image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cs-be-development-repo/${_FE_SERVICE_NAME}:${SHORT_SHA}"

      - "--project=${PROJECT_ID}"
      - "--region=${_REGION}"
      - "--platform=managed"

      # nginx.conf listens on port 8080.
      - "--port=8080"

      # Keep the frontend private.
      - "--ingress=internal"

      # Connect Cloud Run to your existing spoke VPC.
      - "--network=proj-sbd-ai-poc-h-sopke-vnet"
      - "--subnet=proj-sbd-ai-poc-h-sopke-vnet-subnet"
      - "--vpc-egress=all-traffic"

      # Runtime service account.
      - "--service-account=gcc-creative-studio-dev-sa@sbd-ai-poc-h.iam.gserviceaccount.com"

      # Required only if the Internal Load Balancer is expected to invoke
      # Cloud Run without Cloud Run IAM authentication.
      - "--allow-unauthenticated"

    waitFor:
      - "Push Frontend Container"


options:
  logging: "CLOUD_LOGGING_ONLY"