steps:

  # ==========================================================
  # Step 1: Install dependencies
  # ==========================================================

  - name: "node:20-alpine"
    id: "Install Dependencies"
    entrypoint: "npm"
    args:
      - "ci"
    dir: "frontend"


  # ==========================================================
  # Step 2: Build Angular application
  # ==========================================================

  - name: "node:20-alpine"
    id: "Build Angular"
    entrypoint: "npm"

    args:
      - "run"
      - "${_ANGULAR_BUILD_COMMAND}"

    env:
      - "NODE_OPTIONS=--max_old_space_size=4096"

    waitFor:
      - "Install Dependencies"

    dir: "frontend"


  # ==========================================================
  # Step 3: Trigger private Cloud Run deployment
  # ==========================================================

  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    id: "Trigger Frontend Deployment"
    entrypoint: "gcloud"

    args:
      - "builds"
      - "submit"
      - "."
      - "--project=${_TARGET_PROJECT_ID}"
      - "--config=frontend/cloudbuild-deploy.yaml"
      - "--substitutions=_REGION=${_REGION},_FE_SERVICE_NAME=${_FE_SERVICE_NAME}"
      - "--async"

    waitFor:
      - "Build Angular"


# ==========================================================
# Default substitutions
# ==========================================================

substitutions:

  _TARGET_PROJECT_ID: "gebu-demo-sandbox"

  _ANGULAR_BUILD_COMMAND: "build-prod"

  _REGION: "us-central1"

  _FE_SERVICE_NAME: "cstudio-fe"


options:
  logging: "CLOUD_LOGGING_ONLY"