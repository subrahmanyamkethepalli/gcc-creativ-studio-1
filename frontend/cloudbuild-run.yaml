steps:
  # Step 1: Build the frontend container (Angular + Nginx)
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Frontend Image'
    env: ['DOCKER_BUILDKIT=1']
    args:
      [
        'build',
        '-t',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}',
        '.',
      ]
    dir: 'frontend'

  # Step 2: Push the container image to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Image'
    args:
      [
        'push',
        '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}',
      ]

  # Step 3: Deploy to Cloud Run within the spoke VPC
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy to Cloud Run'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - '${_SERVICE_NAME}'
      - '--image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}'
      - '--region=${_REGION}'
      - '--port=8080'
      - '--ingress=internal'
      - '--network=proj-sbd-ai-poc-h-sopke-vnet'
      - '--subnet=proj-sbd-ai-poc-h-sopke-vnet-subnet'
      - '--vpc-egress=all-traffic'
      - '--allow-unauthenticated'
      - '--service-account=${_SERVICE_ACCOUNT}'
      - '--quiet'

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/${_REPO_NAME}/${_SERVICE_NAME}:${_TAG}'

substitutions:
  _SERVICE_NAME: 'cstudio-fe'
  _REPO_NAME: 'cs-be-development-repo'
  _REGION: 'us-central1'
  _SERVICE_ACCOUNT: 'gcc-creative-studio-dev-sa@sbd-ai-poc-h.iam.gserviceaccount.com'
  _TAG: 'latest'

options:
  logging: CLOUD_LOGGING_ONLY
